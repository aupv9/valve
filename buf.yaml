version: v2
modules:
  - path: api
lint:
  use:
    - STANDARD
  except:
    # Keep the message names from the design doc (UsageReport/Directive are
    # reused unchanged at every tier).
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
