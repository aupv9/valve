name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./cmd/...
      - name: Validate policies
        run: |
          go run ./cmd/configurator validate policies
          go run ./cmd/configurator validate deploy/demo/policies

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  proto:
    name: Protobuf
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Lint
        run: buf lint
      - name: Check generated code is up to date
        run: |
          buf generate
          git diff --exit-code -- gen/ || {
            echo "::error::gen/ is out of date. Run 'make proto' and commit the result."
            exit 1
          }

  docker:
    name: Docker image and Envoy demo config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t valve:ci .
      - name: Validate demo Envoy configs
        run: |
          for f in deploy/demo/checkout-envoy.yaml deploy/demo/checkout-app.yaml; do
            docker run --rm -v "$PWD/$f:/envoy.yaml:ro" envoyproxy/envoy:v1.37-latest envoy --mode validate -c /envoy.yaml
          done
      - name: Validate demo policies
        run: docker run --rm -v "$PWD/deploy/demo/policies:/p:ro" valve:ci configurator validate /p
