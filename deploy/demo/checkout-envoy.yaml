# Envoy sidecar in front of the "checkout" service.
#
# The valve.fault.* filters and valve_* virtual clusters come verbatim from:
#   go run ./cmd/configurator envoy -policy deploy/demo/policies -service checkout
# Regenerate them whenever the demo policy changes.
node:
  id: checkout-sidecar
  cluster: checkout

admin:
  address:
    socket_address: {address: 0.0.0.0, port_value: 9901}

layered_runtime:
  layers:
    - name: static
      static_layer: {}
    # Abort ratios pushed by the Valve agent (valve.<bucket>.abort_ppm).
    - name: valve
      rtds_layer:
        name: valve
        rtds_config:
          resource_api_version: V3
          initial_fetch_timeout: 5s
          api_config_source:
            api_type: GRPC
            transport_api_version: V3
            grpc_services:
              - envoy_grpc: {cluster_name: valve_agent}

static_resources:
  listeners:
    - name: inbound
      address:
        socket_address: {address: 0.0.0.0, port_value: 10000}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: inbound
                # --- generated by configurator envoy: Retry-After on Valve's 429s ---
                local_reply_config:
                  mappers:
                    - filter:
                        response_flag_filter:
                          flags: [FI]
                      headers_to_add:
                        - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          header:
                            key: retry-after
                            value: "1"
                route_config:
                  name: checkout
                  virtual_hosts:
                    - name: checkout
                      domains: ["*"]
                      routes:
                        - match: {prefix: "/"}
                          route: {cluster: checkout_app}
                      # --- generated by configurator envoy ---
                      virtual_clusters:
                        - headers:
                            - name: x-valve-caller
                              string_match:
                                exact: web-gateway
                            - name: :path
                              string_match:
                                suffix: /CreateOrder
                          name: valve_checkout-web-create
                        - headers:
                            - name: x-valve-caller
                              string_match:
                                exact: mobile
                          name: valve_checkout-mobile
                http_filters:
                  # --- generated by configurator envoy ---
                  - name: valve.fault.checkout-web-create
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.fault.v3.HTTPFault
                      abort:
                        http_status: 429
                        percentage:
                          denominator: MILLION
                      abort_percent_runtime: valve.checkout-web-create.abort_ppm
                      headers:
                        - name: x-valve-caller
                          string_match:
                            exact: web-gateway
                        - name: :path
                          string_match:
                            suffix: /CreateOrder
                  - name: valve.fault.checkout-mobile
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.fault.v3.HTTPFault
                      abort:
                        http_status: 429
                        percentage:
                          denominator: MILLION
                      abort_percent_runtime: valve.checkout-mobile.abort_ppm
                      headers:
                        - name: x-valve-caller
                          string_match:
                            exact: mobile
                  # --- end generated ---
                  - name: envoy.filters.http.router
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: checkout_app
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: checkout_app
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: checkout-app, port_value: 8080}

    # The Valve agent shares this container's network namespace.
    - name: valve_agent
      type: STATIC
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: valve_agent
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: 127.0.0.1, port_value: 18001}
